<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siyabonga Mdaweni - Personal Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: {
                950: "#061224",
                900: "#0B1F3A",
                800: "#132D52",
                700: "#1E3E6B",
                600: "#2B5288",
              },
              teal: {
                50: "#F0FDFA",
                100: "#CCFBF1",
                200: "#99F6E4",
                300: "#5EEAD4",
                400: "#2DD4BF",
                500: "#14B8A6",
                600: "#0D9488",
                700: "#0F766E",
                800: "#115E59",
                900: "#134E4A",
              },
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: {
                DEFAULT: "hsl(var(--primary))",
                foreground: "hsl(var(--primary-foreground))",
              },
              secondary: {
                DEFAULT: "hsl(var(--secondary))",
                foreground: "hsl(var(--secondary-foreground))",
              },
              muted: {
                DEFAULT: "hsl(var(--muted))",
                foreground: "hsl(var(--muted-foreground))",
              },
              accent: {
                DEFAULT: "hsl(var(--accent))",
                foreground: "hsl(var(--accent-foreground))",
              },
              card: {
                DEFAULT: "hsl(var(--card))",
                foreground: "hsl(var(--card-foreground))",
              },
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            borderRadius: {
              lg: "var(--radius)",
              md: "calc(var(--radius) - 2px)",
              sm: "calc(var(--radius) - 4px)",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              slideInUp: {
                "0%": { transform: "translateY(16px)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
              slideIn: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              floatSlow: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-6px)' },
              },
              pulseGlow: {
                '0%, 100%': { opacity: '0.6', transform: 'scale(1)' },
                '50%': { opacity: '1', transform: 'scale(1.08)' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(200%)' },
              },
              radarSweep: {
                '0%': { transform: 'rotate(0deg)' },
                '100%': { transform: 'rotate(360deg)' },
              },
            },
            animation: {
              fadeIn: "fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards",
              slideInUp: "slideInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards",
              slideIn: 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              floatSlow: 'floatSlow 4s ease-in-out infinite',
              pulseGlow: 'pulseGlow 2.5s ease-in-out infinite',
              shimmer: 'shimmer 2.5s infinite',
              radarSweep: 'radarSweep 5s linear infinite',
            },
          },
        },
      };
    </script>
    <style>
      :root {
        /* Navy + Teal theme on clean light slate/white background */
        --background: 210 40% 98%; /* #F8FAFC */
        --foreground: 215 68% 14%; /* #0B1F3A Deep Navy */
        --card: 0 0% 100%; /* #FFFFFF Crisp White */
        --card-foreground: 215 68% 14%; /* #0B1F3A */
        --primary: 215 68% 14%; /* #0B1F3A Deep Navy */
        --primary-foreground: 0 0% 100%;
        --secondary: 210 40% 96%; /* #F1F5F9 Slate 100 */
        --secondary-foreground: 215 68% 14%;
        --muted: 210 40% 96%;
        --muted-foreground: 215 16% 47%; /* #475569 Slate 600 */
        --accent: 168 76% 97%; /* #F0FDFA Teal 50 */
        --accent-foreground: 173 78% 25%; /* #0F766E Teal 700 */
        --border: 214 32% 91%; /* #E2E8F0 Slate 200 */
        --input: 214 32% 91%;
        --ring: 173 80% 40%; /* #14B8A6 Teal Accent */
        --radius: 0.625rem;
      }
      body {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Smooth interactive card transitions */
      .card-hover-lift {
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease;
      }
      .card-hover-lift:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 25px -5px rgba(11, 31, 58, 0.08), 0 8px 10px -6px rgba(11, 31, 58, 0.04);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
